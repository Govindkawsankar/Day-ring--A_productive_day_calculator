<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Day Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell" style="max-width:420px; padding-top:90px;">
    <div style="text-align:center; margin-bottom:28px;">
        <span class="brand-orbit" style="display:inline-block;"><i></i></span>
        <h1 style="font-size:34px; margin-top:16px;">Welcome back<span>.</span></h1>
        <p style="color:var(--muted); font-size:13px;">Log in to your Day Ring account.</p>
    </div>
    <div class="builder-panel">
        {% if reset_success %}
        <p style="color:var(--green); font-size:12px; margin:0 0 14px;">Password updated — log in with your new password.</p>
        {% endif %}
        {% if error %}
        <p style="color:var(--rose); font-size:12px; margin:0 0 14px;">{{ error }}</p>
        {% endif %}
        <form method="post" style="display:grid; gap:14px;">
            <label style="display:grid; gap:5px; font:500 9px var(--mono); color:var(--muted); letter-spacing:.03em;">
                Username
                <input type="text" name="username" required autofocus>
            </label>
            <label style="display:grid; gap:5px; font:500 9px var(--mono); color:var(--muted); letter-spacing:.03em;">
                Password
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="primary-button" style="width:100%; text-align:center; padding:12px;">Log in</button>
        </form>
        <p style="text-align:center; margin-top:14px;">
            <a href="{{ url_for('forgot_password') }}" style="font-size:11px; color:var(--muted); text-decoration:none;">Forgot password?</a>
        </p>
    </div>
    <p style="text-align:center; margin-top:18px; font-size:12px; color:var(--muted);">
        New here? <a href="{{ url_for('register') }}" style="color:var(--orange-dark); font-weight:700; text-decoration:none;">Create an account</a>
    </p>
</div>
</body>
</html>
