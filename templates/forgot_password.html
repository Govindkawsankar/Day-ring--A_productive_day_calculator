<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Day Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell" style="max-width:420px; padding-top:90px;">
    <div style="text-align:center; margin-bottom:28px;">
        <span class="brand-orbit" style="display:inline-block;"><i></i></span>
        <h1 style="font-size:34px; margin-top:16px;">Reset password<span>.</span></h1>
        <p style="color:var(--muted); font-size:13px;">
            {% if step == 'username' %}Enter your username to get started.{% else %}Answer your security question to set a new password.{% endif %}
        </p>
    </div>
    <div class="builder-panel">
        {% if error %}
        <p style="color:var(--rose); font-size:12px; margin:0 0 14px;">{{ error }}</p>
        {% endif %}

        {% if step == 'username' %}
        <form method="post" style="display:grid; gap:14px;">
            <input type="hidden" name="step" value="username">
            <label style="display:grid; gap:5px; font:500 9px var(--mono); color:var(--muted); letter-spacing:.03em;">
                Username
                <input type="text" name="username" required autofocus>
            </label>
            <button type="submit" class="primary-button" style="width:100%; text-align:center; padding:12px;">Continue</button>
        </form>
        {% else %}
        <form method="post" style="display:grid; gap:14px;">
            <input type="hidden" name="step" value="answer">
            <input type="hidden" name="username" value="{{ username }}">
            <label style="display:grid; gap:5px; font:500 9px var(--mono); color:var(--muted); letter-spacing:.03em;">
                {{ question }}
                <input type="text" name="security_answer" required autofocus>
            </label>
            <label style="display:grid; gap:5px; font:500 9px var(--mono); color:var(--muted); letter-spacing:.03em;">
                New password (6+ characters)
                <input type="password" name="new_password" required minlength="6">
            </label>
            <button type="submit" class="primary-button" style="width:100%; text-align:center; padding:12px;">Reset password</button>
        </form>
        {% endif %}
    </div>
    <p style="text-align:center; margin-top:18px; font-size:12px; color:var(--muted);">
        <a href="{{ url_for('login') }}" style="color:var(--orange-dark); font-weight:700; text-decoration:none;">Back to log in</a>
    </p>
</div>
</body>
</html>
